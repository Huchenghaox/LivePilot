name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked sensitive files
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.local|\.dev\.vars|.*\.db|.*\.sqlite|.*\.sqlite3)$'; then
            echo "Sensitive runtime file is tracked"
            exit 1
          fi
      - name: Check common secret patterns
        run: |
          if git grep -n -I -E 'sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}' -- . ':!package-lock.json' ':!web/package-lock.json' ':!workers/api/package-lock.json'; then
            echo "Possible secret detected"
            exit 1
          fi
      - name: Run non-production preflight
        run: scripts/preflight.sh

  worker-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run d1:migrate:local
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: DATABASE_URL=sqlite:////tmp/livepilot-ci.db alembic upgrade head
      - run: python -m pytest
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
