name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked sensitive files
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.local|.*\.db|.*\.sqlite|.*\.sqlite3)$'; then
            echo "Sensitive runtime file is tracked"
            exit 1
          fi
      - name: Run non-production preflight
        run: scripts/preflight.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: DATABASE_URL=sqlite:////tmp/livepilot-ci.db alembic upgrade head
      - run: python -m pytest
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
